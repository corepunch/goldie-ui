title: Orion UI Framework
description: Standalone C11 UI framework with native backends and WinAPI-style messages
url: https://corepunch.github.io
baseurl: /orion-ui

remote_theme: just-the-docs/just-the-docs

# Transparent vector wordmark shown in the documentation header.
logo: "/assets/images/orion-logo.svg"

# Aux links in top nav
aux_links:
  "GitHub":
    - "https://github.com/corepunch/orion-ui"

# Enable search
search_enabled: true
search_tokenizer_separator: /[\s/]+/

# Footer
footer_content: "Orion UI Framework - standalone, native, and written in C11"

# Navigation order is defined by nav_order front-matter in each page

# Colour scheme (dark retro look to match the framework's aesthetic)
color_scheme: dark

plugins:
  - jekyll-remote-theme
